<style>

<body>
<div id="cv" data-end="40">
  <p class="kk a">SHarness · moving parts · designed</p>
  <div id="id">SH9</div>
  <div class="hl" data-in="0">The moving parts, and <em>one request</em> through them.</div>
  <div id="bd">DESIGNED, NOT BUILT <span>a proposal, no running code</span></div>

  <svg id="pic" viewBox="0 0 1280 720" aria-label="Designed, not built. The person supplies one policy hash to the launcher, which sits outside every domain, makes users and certificates and starts the components. The app talks mTLS to fs, net, bash and llm. Only net and llm talk to the key service.">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--dim)"/></marker></defs>
    <g id="lines" fill="none" stroke="var(--line2)" stroke-width="3">
      <path id="lp" d="M165 222V278" stroke="var(--dim)" marker-end="url(#ah)"/>
      <path id="ll" d="M290 330H358" stroke="var(--dim)" stroke-dasharray="7 6" marker-end="url(#ah)"/>
      <path id="a1" d="M530 290L640 190"/>
      <path id="a2" d="M530 296L640 265"/>
      <path id="a3" d="M530 304L640 340"/>
      <path id="a4" d="M530 310L640 425"/>
      <path id="k1" d="M820 265L960 330" stroke="var(--infra)"/>
      <path id="k2" d="M820 425L960 385" stroke="var(--infra)"/>
    </g>
    <g font-family="system-ui" fill="var(--text)">
      <g id="g-person"><rect x="40" y="160" width="250" height="62" rx="10" fill="var(--bg)" stroke="var(--line2)" stroke-width="3"/>
        <text x="56" y="187" font-size="22" font-weight="800" fill="var(--head)">The person</text><text x="56" y="211" font-size="20" font-weight="600" fill="var(--dim)">one policy hash</text></g>
      <g id="g-launch"><rect x="40" y="280" width="250" height="165" rx="10" fill="var(--bg)" stroke="var(--dim)" stroke-width="3" stroke-dasharray="8 6"/>
        <text x="56" y="308" font-size="22" font-weight="800" fill="var(--head)">Launcher</text>
        <text x="56" y="334" font-size="20" font-weight="600" fill="var(--accent)">outside every domain</text>
        <text x="56" y="362" font-size="20" font-weight="600" fill="var(--dim)">checks the hash,</text>
        <text x="56" y="386" font-size="20" font-weight="600" fill="var(--dim)">makes users and</text>
        <text x="56" y="410" font-size="20" font-weight="600" fill="var(--dim)">certificates, starts</text>
        <text x="56" y="434" font-size="20" font-weight="600" fill="var(--dim)">the components</text></g>
      <g id="g-app"><rect id="r-app" x="360" y="260" width="170" height="80" rx="10" fill="var(--bg)" stroke="var(--agent)" stroke-width="3"/>
        <text x="376" y="293" font-size="22" font-weight="800" fill="var(--head)">The app</text><text x="376" y="320" font-size="20" font-weight="600" fill="var(--dim)">the agent</text></g>
      <text id="t-mtls" x="545" y="244" font-size="20" font-weight="700" fill="var(--dim)" transform="rotate(-16 545 244)">mTLS</text>

      <g id="g-net"><rect id="r-net" x="640" y="240" width="180" height="60" rx="8" fill="var(--panel)" stroke="var(--infra)" stroke-width="3"/><text x="656" y="278" font-size="22" font-weight="800" fill="var(--head)">net</text></g>
      <g id="g-bash"><rect id="r-bash" x="640" y="320" width="180" height="60" rx="8" fill="var(--panel)" stroke="var(--infra)" stroke-width="3"/><text x="656" y="358" font-size="22" font-weight="800" fill="var(--head)">bash</text></g>
      <g id="g-llm"><rect id="r-llm" x="640" y="400" width="180" height="60" rx="8" fill="var(--panel)" stroke="var(--infra)" stroke-width="3"/><text x="656" y="438" font-size="22" font-weight="800" fill="var(--head)">llm</text></g>
      <g id="g-kms"><rect id="r-kms" x="960" y="310" width="260" height="100" rx="10" fill="var(--panel)" stroke="var(--infra)" stroke-width="3"/>
        <text x="976" y="342" font-size="22" font-weight="800" fill="var(--head)">kms</text>
        <text x="976" y="372" font-size="20" font-weight="600" fill="var(--accent)">never returns</text><text x="976" y="396" font-size="20" font-weight="600" fill="var(--accent)">a clear key</text></g>
      <text id="t-only" x="1220" y="442" font-size="20" font-weight="700" fill="var(--infra)" text-anchor="end" opacity="0">only net and llm talk to kms</text>
            <circle id="dot" r="12" fill="var(--agent)" cx="445" cy="300" opacity="0"/>
    </g>
  </svg>

  <div id="cap"></div>
  <div id="foot"></div>
  <div class="bar"><i></i></div>
</div>
<script>
(function () {
  'use strict'
  // Facts carried inline from the captures diag-moving-parts (sharness2-design-brief) and diag-one-request
  // (sharness2-design-svg-one-request). The capture file is not served; nothing is fetched. No command is reproduced.
  var STEPS = [
    { t: 14, hot: ['app'], n: '1. The agent asks to clone a vault from a sealed handover.', x: 'A request in words to the app. The handover is an image the agent cannot read as a key.', p: [445, 300] },
    { t: 17.5, hot: ['app'], n: '2. Strict checks on the QR.', x: 'The handover is parsed strictly before anything leaves the app. The sealed first message is read, not opened.', p: [445, 300] },
    { t: 21, hot: ['net', 'kms'], n: '3. net makes a one-time key E, and asks kms to unwrap.', x: 'It sends E\'s public half, a nonce, a timestamp and the operation. Only net and llm may talk to kms.', p: [730, 270], q: [1170, 385] },
    { t: 24.5, hot: ['kms'], n: '4. kms checks, derives, scrubs, seals.', x: '<b>To me? Signed? Unexpired? Nonce new?</b> Then it derives the keys, scrubs the vault key from memory and seals the keys to E.', p: [1170, 385] },
    { t: 28.5, hot: ['net', 'kms'], n: '5. net opens them with E, drops E, fetches and decrypts the packs.', x: 'E lived for this one request. The keys reach net sealed; they never reach the app.', p: [1170, 385], q: [730, 270] },
    { t: 32, hot: ['fs'], n: '6. fs writes the tree and a sealed key file.', x: 'The working tree appears on disk. The key file next to it is sealed, not readable by the agent.', p: [730, 190] },
    { t: 35, hot: ['app'], n: '7. The agent sees only a status line.', x: '<span class="ok">Cloned. Sealed to a fingerprint. Expires 30 Oct.</span> Nothing else comes back.', p: [445, 300] } ]
  var NODES = ['app', 'fs', 'net', 'bash', 'llm', 'kms']
  var END = { n: 'What the transcript sees', x: '<b>The request in words, ciphertext, fingerprints</b> (sha256:...). <span class="ok">Never a key.</span> Only net and llm touch kms, and kms never returns a clear key.' }
  window.SLIDE_RENDER = function (t, S) {
    var k = function (a, d) { return S.ease(S.seg(t, a, a + (d || .6))) }
    var g = function (id, v) { S.$(id).style.opacity = v }
    var act2 = t >= 14
    g('g-person', k(2)); g('lp', k(3)); g('g-launch', k(3.5)); g('ll', k(5)); g('g-app', k(6))
    ;['fs', 'net', 'bash', 'llm'].forEach(function (n, i) { g('g-' + n, k(7.5 + i * .5)) })
    ;['a1', 'a2', 'a3', 'a4'].forEach(function (id, i) { g(id, k(7.5 + i * .5)) }); g('t-mtls', k(8))
    g('g-kms', k(11)); g('k1', k(11.5)); g('k2', k(11.5)); g('t-only', k(12))
    var cur = -1
    STEPS.forEach(function (s, i) { if (t >= s.t) cur = i })
    var ended = t >= 36.5, hot = []
    if (cur >= 0 && !ended) hot = STEPS[cur].hot
    NODES.forEach(function (n) {
      var on = !act2 || ended || hot.indexOf(n) >= 0
      S.$('g-' + n).style.opacity = (n === 'app' ? k(6) : n === 'kms' ? k(11) : k(7.5)) * (on ? 1 : .35)
    })
    var dot = S.$('dot')
    if (cur >= 0 && !ended) {
      var s = STEPS[cur], f = S.ease(S.seg(t, s.t, s.t + 1.5)), q = s.q || s.p
      var from = cur > 0 && STEPS[cur - 1].q ? STEPS[cur - 1].q : (cur > 0 ? STEPS[cur - 1].p : s.p)
      var a = s.q ? s.p : from, b = s.q ? s.q : s.p
      dot.setAttribute('cx', S.lerp(a[0], b[0], f)); dot.setAttribute('cy', S.lerp(a[1], b[1], f)); dot.setAttribute('opacity', 1)
    } else dot.setAttribute('opacity', 0)
    var h = ''
    if (ended) h = '<span class="n">' + END.n + '</span>' + END.x
    else if (cur >= 0) h = '<span class="n">' + STEPS[cur].n + '</span>' + STEPS[cur].x
    else h = '<span class="n">Act 1: the parts</span>One policy hash comes from the person. The launcher, outside every domain, checks it and starts everything else. The app reaches fs, net, bash and llm over mTLS; only net and llm reach kms.'
    if (S.$('cap').innerHTML !== h) S.$('cap').innerHTML = h
    var f = 'Source: sharness.ai, design page (captures: diag-moving-parts, sharness2-design-brief; diag-one-request, sharness2-design-svg-one-request). <b>Designed, not built</b>: every part and step is a proposal. No before state.'
    if (S.$('foot').innerHTML !== f) S.$('foot').innerHTML = f
  }
})()
</script>
