<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHarness: without and with</title>
<link rel="stylesheet" href="../../../../../talk/engine/slide.css">
<script>window.RUV_STEPS = [{ t: 0, label: 'without' }, { t: 15, label: 'with' }, { t: 34, label: 'six of six held' }, { t: 39, label: 'the caveat' }]</script>
<script src="../../../../../talk/engine/slide.js"></script>
<style>
.kk{font-size:20px;top:14px}
.hl{top:52px;font-size:40px;right:230px}
#id{position:absolute;right:40px;top:6px;font:800 72px/1 system-ui;color:var(--head)}
.ph{position:absolute;top:118px;width:580px;font:800 24px/1.2 system-ui;color:var(--head)}
.ph span{display:block;font:600 20px/1.3 system-ui;color:var(--dim)}
.row{position:absolute;width:580px;font:20px/24px system-ui;color:var(--text)}
.row i{font-style:normal;font-weight:800;color:var(--head)}
.res{position:absolute;font:700 20px/24px system-ui;white-space:nowrap}
.res.go{color:var(--text)}
.res.held{color:var(--accent)}
#pic{position:absolute;left:0;top:0;width:1280px;height:720px}
#foot{position:absolute;left:40px;right:40px;bottom:12px;font:20px/1.3 system-ui;color:var(--dim)}
#foot b{color:var(--head)}
</style>
</head>
<body>
<div id="cv" data-end="46">
  <p class="kk a">SHarness · without and with · v1, driven</p>
  <div id="id">SH1</div>
  <div class="hl" data-in="0">Same tool, same six actions: <em>without, and with.</em></div>
  <div class="ph" id="phL" style="left:40px">Without<span>no policy: drawn, not a measured row</span></div>
  <div class="ph" id="phR" style="left:660px">With<span>hello's deny-all policy, the kernel told first</span></div>
  <svg id="pic" viewBox="0 0 1280 720" aria-label="Six actions by the same tool: on the left with no policy, each goes through; on the right under a policy the kernel holds, one allowed and five refused"></svg>
  <div id="rows"></div>
  <div id="foot"></div>
  <div class="bar"><i></i></div>
</div>
<script>
(function () {
  'use strict'
  // Short words read from harness.json's probes; "without" is not a measured row: it is what the same action does with no policy.
  var P = {
    'hello-1-read': ['List /usr', 'allowed', 'allowed', 'pass'],
    'hello-2-tmp-write': ['Write a file in /tmp', 'writes', 'refused', 'stop'],
    'hello-3-workspace-write': ['Write a file in the workspace', 'writes', 'refused', 'stop'],
    'hello-4-tcp-connect': ['Connect out to 1.1.1.1:443', 'connects', 'refused', 'stop'],
    'hello-5-wrong-hash': ['Run under a wrong hash', 'runs: no check', 'nothing ran', 'stop'],
    'hello-6-memory': ['Take 400 MiB of memory', 'takes it', 'refused, capped', 'stop'] }
  var NS = 'http://www.w3.org/2000/svg', D = null, B = null, TOP = 190, H = 64, AL = [2, 3.8, 5.6, 7.4, 9.2, 11], AR = [17, 19.5, 22, 24.5, 27, 29.5]
  fetch('../../../../data/harness.json').then(function (r) { return r.json() }).then(function (j) { D = j })
    .catch(function (e) { console.error('SH1: the data file did not load', e) })
  function el(tag, a, p) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e }
  function line(p, x0, y, x1, col) { var l = el('path', { d: 'M' + x0 + ' ' + y + 'H' + x1, fill: 'none', stroke: col, 'stroke-width': 5, 'stroke-linecap': 'round' }, p); l.L = x1 - x0; l.setAttribute('stroke-dasharray', l.L + ' ' + l.L); return l }

  function build(S) {
    var svg = S.$('pic'), html = '', rows = []
    el('line', { x1: 640, y1: 130, x2: 640, y2: 570, stroke: 'var(--line2)', 'stroke-width': 2 }, svg)
    D.probes.forEach(function (p, i) {
      var m = P[p.id]; if (!m) return
      var y = TOP + i * H, py = y + 40
      ;[[40, 'L', m[1], 'go'], [660, 'R', m[2], 'held']].forEach(function (side) {
        var x0 = side[0], g = el('g', {}, svg), o = { g: g, side: side[1] }
        html += '<div class="row" id="r' + side[1] + i + '" style="left:' + x0 + 'px;top:' + y + 'px"><i>' + (i + 1) + '</i> ' + m[0] + '</div>'
        html += '<div class="res ' + (side[1] === 'L' ? 'go' : (m[3] === 'pass' ? 'held' : 'held')) + '" id="x' + side[1] + i + '" style="left:' + (x0 + (side[1] === 'R' ? 352 : 370)) + 'px;top:' + (py - 12) + 'px">' + side[2] + (side[1] === 'R' ? ': held' : '') + '</div>'
        el('circle', { cx: x0 + 10, cy: py, r: 8, fill: 'var(--agent)' }, g)
        if (side[1] === 'L') o.l1 = line(g, x0 + 18, py, x0 + 350, 'var(--dim)')
        else if (m[3] === 'pass') {
          el('rect', { x: x0 + 175, y: py - 15, width: 10, height: 9, rx: 3, fill: 'var(--accent)' }, g); el('rect', { x: x0 + 175, y: py + 6, width: 10, height: 9, rx: 3, fill: 'var(--accent)' }, g)
          o.l1 = line(g, x0 + 18, py, x0 + 336, 'var(--infra)')
        } else { el('rect', { x: x0 + 174, y: py - 15, width: 12, height: 30, rx: 3, fill: 'var(--accent)' }, g); o.l1 = line(g, x0 + 18, py, x0 + 168, 'var(--agent)') }
        if (side[1] === 'R' && i === 0) { var tl = el('text', { x: x0 + 180, y: py - 22, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 700, fill: 'var(--accent)' }, g); tl.textContent = 'the policy' }
        o.i = i; rows.push(o)
      })
    })
    S.$('rows').innerHTML = html
    B = { rows: rows, held: D.probes.filter(function (p) { return /\(held\)/.test(p.result) }).length, n: D.probes.length, envs: D.environments.length }
  }

  window.SLIDE_RENDER = function (t, S) {
    if (!D) return
    if (!B) build(S)
    var k = function (a, d) { return S.ease(S.seg(t, a, a + (d || .5))) }
    S.$('phL').style.opacity = k(1); S.$('phR').style.opacity = k(15.5)
    B.rows.forEach(function (o) {
      var a = o.side === 'L' ? AL[o.i] : AR[o.i]
      S.$('r' + o.side + o.i).style.opacity = k(a, .4); o.g.style.opacity = k(a, .4)
      o.l1.setAttribute('stroke-dashoffset', o.l1.L * (1 - S.seg(t, a + .2, a + 1.1)))
      S.$('x' + o.side + o.i).style.opacity = k(a + 1.1, .4)
    })
    var f = ''
    if (t >= 34) f = '<b>With: ' + B.held + ' of ' + B.n + ' held</b>, 25 October 2026, in ' + B.envs + ' environments on two kernels (sharness.ai\'s own runs). <b>Without:</b> not a measured row.'
    if (t >= 39) f += '<br><b>The caveat:</b> the launcher above the agent, which makes this a boundary for the agent itself, is designed.'
    if (S.$('foot').innerHTML !== f) S.$('foot').innerHTML = f
  }
})()
</script>
</body>
</html>
