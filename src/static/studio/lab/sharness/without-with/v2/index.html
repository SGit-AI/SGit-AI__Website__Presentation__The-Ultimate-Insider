<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHarness: without and with, measured</title>
<link rel="stylesheet" href="../../../../../talk/engine/slide.css">
<script>window.RUV_STEPS = [{ t: 0, label: 'the request' }, { t: 3, label: 'no policy' }, { t: 10, label: 'off the allowlist' }, { t: 17, label: 'under P1' }, { t: 28, label: 'under P5' }, { t: 33, label: 'the end line' }]</script>
<script src="../../../../../talk/engine/slide.js"></script>
<style>
.kk{font-size:20px;top:14px}
.hl{top:52px;font-size:40px;right:230px}
#id{position:absolute;right:40px;top:6px;font:800 72px/1 system-ui;color:var(--head)}
#hd{position:absolute;left:0;top:112px;width:1280px;height:26px;font:800 20px/26px system-ui;letter-spacing:.03em;text-transform:uppercase;color:var(--dim)}
#hd span{position:absolute;white-space:nowrap;transform:translateX(-50%)}
#pic{position:absolute;left:0;top:0;width:1280px;height:720px}
.nm{position:absolute;left:40px;width:240px;font:800 22px/28px system-ui;color:var(--head)}
.nm i{display:block;font:600 20px/24px system-ui;font-style:normal;color:var(--dim)}
.tx{position:absolute;font:20px/24px system-ui;color:var(--text);white-space:nowrap}
.tx.ok{color:var(--head);font-weight:700}
.tx.wall{color:var(--accent);font-weight:700}
.tx.leak{color:var(--risk);font-weight:700}
#foot{position:absolute;left:40px;right:30px;bottom:12px;font:20px/1.3 system-ui;color:var(--dim)}
#foot b{color:var(--head)}
#foot p{margin:0 0 4px}
</style>
</head>
<body>
<div id="cv" data-end="40">
  <p class="kk a">SHarness · without and with · v2, measured</p>
  <div id="id">SH1</div>
  <div class="hl" data-in="0">The same wget, four ways: <em>through, or at a wall.</em></div>
  <div id="hd"></div>
  <svg id="pic" viewBox="0 0 1280 720" aria-label="One wget travels guest, kernel, the page's fetch, the internet. With no policy it goes through. Off the page's allowlist the page answers 403. Under P1 the kernel refuses it, yet a thin DNS path still leaks. Under P5 it goes through."></svg>
  <div id="cells"></div>
  <div id="foot"></div>
  <div class="bar"><i></i></div>
</div>
<script>
(function () {
  'use strict'
  // Facts carried inline from the capture: playground-interceptor (source_id sharness-evidence), sharness.ai's playground network panel.
  // The request: wget http://sharness.ai/llms.txt, from the guest, through the page's fetch(). All four rows are the site's own measured steps.
  var ROWS = [
    { n: '1', name: 'No policy', sub: 'a measured step', at: 3, kind: 'go',
      lines: [['ok', 'DNS, TCP :80, HTTP GET: 200. The file returns.']] },
    { n: '2', name: 'Off the allowlist', sub: 'the page\'s own list', at: 10, kind: 'page',
      lines: [['wall', 'The page answers 403, logged blocked: a wall at the page.']] },
    { n: '3', name: 'Under P1', sub: 'TCP 443 only', at: 17, kind: 'kernel',
      lines: [['wall', 'Permission denied (EACCES), before any TCP packet leaves.'], ['leak', 'The DNS query still leaks: Landlock does not see UDP.']] },
    { n: '4', name: 'Under P5', sub: '80 and 443', at: 28, kind: 'go',
      lines: [['ok', 'The policy allows it: the file returns.']] }]
  var CX = [330, 620, 900, 1190], HEAD = ['the guest', 'the kernel', 'the page\'s fetch()', 'the internet']
  var TOP = 150, ROW = 98, NS = 'http://www.w3.org/2000/svg', B = null
  function el(tag, a, p) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e }
  function path(p, d, col, w, dash) {
    var e = el('path', { d: d, fill: 'none', stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' }, p)
    e.L = e.getTotalLength(); e.D = dash
    if (!dash) e.setAttribute('stroke-dasharray', e.L + ' ' + e.L)
    return e
  }
  function gate(p, x, y, col, open) {
    var g = el('g', {}, p)
    if (open) { el('rect', { x: x - 7, y: y - 17, width: 14, height: 11, rx: 3, fill: 'none', stroke: 'var(--dim)', 'stroke-width': 2 }, g); el('rect', { x: x - 7, y: y + 6, width: 14, height: 11, rx: 3, fill: 'none', stroke: 'var(--dim)', 'stroke-width': 2 }, g) }
    else el('rect', { x: x - 8, y: y - 19, width: 16, height: 38, rx: 3, fill: col }, g)
    return g
  }
  function build(S) {
    var svg = S.$('pic'), html = '', rows = []
    S.$('hd').innerHTML = HEAD.map(function (h, i) { return '<span style="left:' + CX[i] + 'px"' + (i === 0 ? ' class="fx" style="color:var(--agent)"' : '') + '>' + h + '</span>' }).join('')
    S.$('hd').firstChild.style.color = 'var(--agent)'
    CX.forEach(function (x) { el('line', { x1: x, y1: 142, x2: x, y2: 548, stroke: 'var(--line2)', 'stroke-width': 2, 'stroke-dasharray': '2 8' }, svg) })
    ROWS.forEach(function (r, i) {
      var y0 = TOP + i * ROW, y = y0 + 20, g = el('g', {}, svg), o = { r: r, g: g }
      html += '<div class="nm" id="n' + i + '" style="top:' + (y0 - 2) + 'px"><span style="color:var(--dim)">' + r.n + '</span> ' + r.name + '<i>' + r.sub + '</i></div>'
      r.lines.forEach(function (l, j) { html += '<div class="tx ' + l[0] + '" id="t' + i + '_' + j + '" style="left:' + (CX[0] - 20) + 'px;top:' + (y0 + 44 + j * 26) + 'px">' + l[1] + '</div>' })
      el('circle', { cx: CX[0], cy: y, r: 9, fill: 'var(--agent)' }, g)
      var stop = r.kind === 'go' ? CX[3] : r.kind === 'page' ? CX[2] : CX[1]
      o.p = path(g, 'M' + CX[0] + ' ' + y + 'H' + (r.kind === 'go' ? CX[3] : stop - 12), 'var(--agent)', 5)
      o.gk = gate(g, CX[1], y, 'var(--accent)', r.kind !== 'kernel')
      o.gp = gate(g, CX[2], y, 'var(--accent)', r.kind !== 'page')
      if (r.kind === 'go') { o.end = el('circle', { cx: CX[3], cy: y, r: 9, fill: 'var(--agent)' }, g) }
      if (r.kind === 'kernel') {
        o.leak = path(g, 'M' + CX[0] + ' ' + (y + 15) + 'H' + CX[3], 'var(--risk)', 3, '8 8')
        o.leak.setAttribute('stroke-dasharray', '8 8')
        o.leakwrap = o.leak
        o.lend = el('circle', { cx: CX[3], cy: y + 15, r: 7, fill: 'none', stroke: 'var(--risk)', 'stroke-width': 3 }, g)
        var lb = el('text', { x: CX[3] - 20, y: y - 12, 'text-anchor': 'end', 'font-size': 20, 'font-weight': 700, fill: 'var(--risk)' }, g); lb.textContent = 'DNS, UDP'; o.lb = lb
      }
      rows.push(o)
    })
    S.$('cells').innerHTML = html
    B = rows
  }
  window.SLIDE_RENDER = function (t, S) {
    if (!B) build(S)
    var k = function (a, d) { return S.ease(S.seg(t, a, a + (d || .5))) }
    S.$('hd').style.opacity = k(.5)
    B.forEach(function (o, i) {
      var a = o.r.at, f = S.seg(t, a + .3, a + 2.2)
      o.g.style.opacity = k(a, .4)
      o.p.setAttribute('stroke-dashoffset', o.p.L * (1 - f))
      if (o.end) o.end.style.opacity = f >= 1 ? 1 : 0
      S.$('n' + i).style.opacity = k(a, .4)
      o.r.lines.forEach(function (l, j) { S.$('t' + i + '_' + j).style.opacity = k(a + 2.2 + j * 4.5, .5) })
      if (o.leak) {
        var lf = S.seg(t, a + 5, a + 7)
        o.leak.style.opacity = lf > 0 ? 1 : 0
        o.leak.setAttribute('stroke-dasharray', lf >= 1 ? '8 8' : (o.leak.L * lf) + ' ' + o.leak.L)
        o.lend.style.opacity = lf >= 1 ? 1 : 0; o.lb.style.opacity = lf >= 1 ? 1 : 0
      }
    })
    var f = ''
    if (t >= 33) f = '<p><b>Without and with, both measured, in the playground (sharness.ai\'s own runs). The policy held the connect; DNS still left.</b></p>'
      + '<p>The caveat: we did not run the playground; the capture read the page\'s HTML and script. The measured rows are sharness.ai\'s.</p>'
    else f = ''
    var fs = S.$('foot'); if (fs.innerHTML !== f) fs.innerHTML = f
    fs.style.opacity = k(33, .6)
    var s = S.$('src'); if (!s) { s = document.createElement('div'); s.id = 'src'; s.className = 'tx'; s.style.cssText = 'left:40px;top:560px;color:var(--dim)'; s.textContent = 'Source: sharness.ai, the playground\'s network panel (capture: playground-interceptor, sharness-evidence). One author, own site.'; S.$('cells').appendChild(s) }
    s.style.opacity = k(1, .6)
  }
})()
</script>
</body>
</html>
