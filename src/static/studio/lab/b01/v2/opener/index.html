<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B01 v2: an act opens</title>
<link rel="stylesheet" href="../../../../../talk/engine/slide.css">
<script src="../../../../../talk/engine/slide.js"></script>
<script src="../frames.js"></script>
<style>
#b01{position:absolute;left:0;top:0;width:1280px;height:720px}
.kk{font-size:20px;top:14px}
.hl{top:58px}
.ft{font-size:20px;bottom:14px}
.lab{position:absolute;font:800 24px/1.2 system-ui;max-width:300px}
.lab span{display:block;font:600 20px/1.3 system-ui;color:var(--text);margin-top:4px}
.lab b{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--head);color:var(--bg);font:800 22px system-ui;margin-right:8px;vertical-align:middle}
</style>
</head>
<body>
<div id="cv" data-end="4">
  <p class="kk"><span id="act"></span></p>
  <div class="lab c-head" style="left:60px;top:560px" id="actlab"></div>
  <div class="ft">B01 v2 · frames 3 to 5 · run r6-b01-v2 · timed to the script at 150 words a minute</div>
  <div class="bar"><i></i></div>
</div>
<script>
window.SLIDE_RENDER = function (t, S) {
  var k = function (a, d) { return S.ease(S.seg(t, a, a + (d || .8))) }
  // ?act=1, 2 or 3: that act's circle in focus, its colour pouring into its third of the overlap; earlier acts' thirds stay
  var a = Math.max(1, Math.min(3, +(new URLSearchParams(location.search).get('act') || 1))), i = a - 1
  var N = ['Act one: the insider', 'Act two: the infrastructure', 'Act three: the decision']
  if (S.$('act').textContent !== N[i]) { S.$('act').textContent = N[i]; S.$('actlab').textContent = N[i].split(': ')[1]; S.$('actlab').className = 'lab ' + ['c-agent', 'c-infra', 'c-risk'][i] }
  var op = [0, 1, 2].map(function (j) { return j === i ? 1 : .3 }), fill = [0, 1, 2].map(function (j) { return j < i ? 1 : j === i ? k(.4, 2.2) : 0 })
  B01.set({ pos: 1, op: op, sop: [.92, .92, .92], fill: fill, edge: 1, dash: false, marks: 0, fence: { w: 150, h: 120, op: 0 }, badges: [0, 0, 0, 0] })
}
</script>
</body>
</html>
