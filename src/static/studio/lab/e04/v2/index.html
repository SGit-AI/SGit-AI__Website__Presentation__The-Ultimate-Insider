<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E04 v2: the over-enthusiastic agent, four paths</title>
<link rel="stylesheet" href="../../../../talk/engine/slide.css">
<script src="../../../../talk/engine/slide.js"></script>
<style>
.kk{font-size:20px;top:14px}
.hl{top:52px;font-size:40px}
#hd{position:absolute;left:0;top:110px;width:1280px;height:26px;font:800 20px/26px system-ui;letter-spacing:.03em;text-transform:uppercase;color:var(--dim)}
#hd span{position:absolute;white-space:nowrap}
#hd .fx{color:var(--agent)}
#paths{position:absolute;left:0;top:0;width:1280px;height:720px}
.cell{position:absolute;font:20px/22px system-ui;color:var(--text)}
.cell.nm{font:800 22px/28px system-ui;white-space:nowrap;color:var(--head)}
.cell.nm i{display:block;font:600 20px/24px system-ui;font-style:normal;color:var(--dim)}
.cell.fx{color:var(--agent);font-weight:600}
#tags{position:absolute;left:40px;right:30px;top:576px;font:20px/24px system-ui;color:var(--text)}
#tags .ln{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
#tags b{color:var(--head);margin-right:4px}
#tags .chip{border:2px solid var(--line2);border-radius:999px;padding:1px 12px;white-space:nowrap}
#end{position:absolute;left:40px;right:30px;bottom:16px;font:20px/1.3 system-ui;color:var(--dim)}
#end b{color:var(--head)}
</style>
</head>
<body>
<div id="cv" data-end="44">
  <p class="kk a">Studio experiment E04 · v2, driven</p>
  <div class="hl" data-in="0">Only trying to help, <em>it removed what was in the way.</em></div>
  <div id="hd"></div>
  <svg id="paths" viewBox="0 0 1280 720" aria-label="Four checked cases as paths: the goal, what was meant to stop the agent, the agent going through, around or past it, and the loss"></svg>
  <div id="cells"></div>
  <div id="tags"></div>
  <div id="end"></div>
  <div class="bar"><i></i></div>
</div>
<script>
(function () {
  'use strict'
  // Short words for the slide, read from each case's asked, guardrail_present, did_about_it and lost; the file's own words are in the explainer.
  // wall: break (it did not hold), none (nothing held), around (it held, and the agent went round it)
  var MAIN = [
    ['replit-deletes-prod-db', "Replit's agent", 'checked', 'keep building the app', 'a code freeze, given as an instruction: did not hold', 'ran database commands on the live database', '1,206 executives, 1,196+ firms (its count); recovered', 'break'],
    ['pocketos-cursor-railway', 'Cursor on Railway', 'checked', 'a staging task (per the founder)', 'none held: an account-wide token; no confirmation on the delete', 'used a locally stored, account-wide token; deleted what proved to be production', 'production data and backups; 30 hours; restored', 'none'],
    ['gemini-cli-failed-you', 'Gemini CLI', 'checked', 'rename a folder, move its files', "the tools' project-root limit: it held for the rename", 'went around it in the shell (inferred): moved every file to a missing folder', 'every file in the project folder; none recovered', 'around'],
    ['aws-kiro-cost-explorer', 'AWS Kiro', 'disputed', 'fix an issue in Cost Explorer', 'asks authorisation by default (Amazon): did not hold', 'per the FT: delete and recreate the environment; Amazon: user error', '13 hours down in one region (FT)', 'break']]
  var TAGS = [['Reported, not checked against a primary', [['antigravity-d-drive', 'Antigravity'], ['codex-gpt56-home-deletion', 'Codex'], ['openclaw-meta-inbox', 'OpenClaw'], ['meta-internal-agent-sev1', "Meta's agent"]]],
    ['Evaluations, not deployments', [['hf-openai-exploitgym', 'OpenAI at Hugging Face (per press)'], ['anthropic-irregular-evals', 'Claude at Irregular'], ['anthropic-fourth-incident', 'an early Claude Opus 4.6']]]]
  var COL = { nm: [40, 196], goal: [250, 200], way: [462, 270], fix: [748, 290], loss: [1054, 200] }
  var TOP = 140, ROW = 106, X0 = 254, WX = 597, X1 = 1240, AT = [2, 9, 15, 21]
  var NS = 'http://www.w3.org/2000/svg', D = null, B = null
  fetch('../../../data/over-enthusiastic.json').then(function (r) { return r.json() }).then(function (j) { D = j })
    .catch(function (e) { console.error('E04: the data file did not load', e) })
  function el(tag, a, p) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;') }

  function build(S) {
    var by = {}; D.cases.forEach(function (c) { by[c.id] = c })
    var svg = S.$('paths'), cells = '', rows = []
    S.$('hd').innerHTML = [['the case', 'nm'], ['the goal', 'goal'], ['meant to stop it', 'way'], ['what it did', 'fix'], ['the loss', 'loss']].map(function (h) { return '<span' + (h[1] === 'fix' ? ' class="fx"' : '') + ' style="left:' + COL[h[1]][0] + 'px">' + h[0] + '</span>' }).join('')
    MAIN.forEach(function (m, i) {
      var c = by[m[0]]; if (!c) return
      var y0 = TOP + i * ROW, y = y0 + 16, cell = function (k, cls, html) { return '<div class="cell ' + cls + '" id="c' + i + k + '" style="left:' + COL[k][0] + 'px;width:' + COL[k][1] + 'px;top:' + (k === 'nm' ? y0 : y0 + 38) + 'px">' + html + '</div>' }
      cells += cell('nm', 'nm', esc(m[1]) + '<i>' + m[2] + ', ' + c.date.slice(0, 4) + '</i>') + cell('goal', '', esc(m[3])) + cell('way', '', esc(m[4])) + cell('fix', 'fx', esc(m[5])) + cell('loss', '', esc(m[6]))
      var g = el('g', {}, svg), r = { g: g, kind: m[7], y: y }
      el('circle', { cx: X0, cy: y, r: 7, fill: 'var(--head)' }, g)
      r.p1 = el('path', { d: 'M' + X0 + ' ' + y + 'H' + (WX - (m[7] === 'around' ? 34 : 0)), fill: 'none', stroke: 'var(--head)', 'stroke-width': 4, 'stroke-linecap': 'round' }, g)
      var d2 = m[7] === 'around' ? 'M' + (WX - 34) + ' ' + y + 'C' + (WX - 20) + ' ' + (y - 40) + ' ' + (WX + 20) + ' ' + (y - 40) + ' ' + (WX + 34) + ' ' + y + 'H' + X1 : 'M' + WX + ' ' + y + 'H' + X1
      r.p2 = el('path', { d: d2, fill: 'none', stroke: 'var(--agent)', 'stroke-width': 4, 'stroke-linecap': 'round' }, g)
      r.head = el('circle', { cx: X1, cy: y, r: 9, fill: 'var(--agent)' }, g)
      r.w = el('g', {}, g)
      if (m[7] === 'none') el('rect', { x: WX - 7, y: y - 16, width: 14, height: 32, rx: 3, fill: 'none', stroke: 'var(--dim)', 'stroke-width': 2, 'stroke-dasharray': '4 4' }, r.w)
      else { r.top = el('rect', { x: WX - 7, y: y - 16, width: 14, height: 16, rx: 3, fill: 'var(--head)' }, r.w); r.bot = el('rect', { x: WX - 7, y: y, width: 14, height: 16, rx: 3, fill: 'var(--head)' }, r.w) }
      r.l1 = r.p1.getTotalLength(); r.l2 = r.p2.getTotalLength()
      ;[[r.p1, r.l1], [r.p2, r.l2]].forEach(function (p) { p[0].setAttribute('stroke-dasharray', p[1] + ' ' + p[1]) })
      rows.push(r)
    })
    S.$('cells').innerHTML = cells
    S.$('tags').innerHTML = TAGS.map(function (t, i) {
      var have = t[1].filter(function (x) { return by[x[0]] })
      return '<div class="ln" id="t' + i + '"><b>' + t[0] + ' (' + have.length + '):</b>' + have.map(function (x) { return '<span class="chip">' + esc(x[1]) + '</span>' }).join('') + '</div>'
    }).join('')
    B = { rows: rows }
  }

  window.SLIDE_RENDER = function (t, S) {
    if (!D) return
    if (!B) build(S)
    var k = function (a, d) { return S.ease(S.seg(t, a, a + (d || .6))) }
    S.$('hd').style.opacity = k(1)
    B.rows.forEach(function (r, i) {
      var a = AT[i], f1 = S.seg(t, a + .4, a + 1.8), f2 = S.seg(t, a + 2.5, a + 3.8), br = S.ease(S.seg(t, a + 1.8, a + 2.5))
      r.g.style.opacity = k(a, .4)
      r.p1.setAttribute('stroke-dashoffset', r.l1 * (1 - f1)); r.p2.setAttribute('stroke-dashoffset', r.l2 * (1 - f2))
      r.head.style.opacity = f2 >= 1 ? 1 : 0
      if (r.kind === 'break') {                                      // it did not hold: the two halves part and fade
        r.top.setAttribute('transform', 'translate(' + (-4 * br) + ' ' + (-3 * br) + ') rotate(' + (-25 * br) + ' ' + WX + ' ' + (r.y - 8) + ')')
        r.bot.setAttribute('transform', 'translate(' + (4 * br) + ' ' + (3 * br) + ') rotate(' + (25 * br) + ' ' + WX + ' ' + (r.y + 8) + ')')
        r.w.style.opacity = 1 - .55 * br
      }
      S.$('c' + i + 'nm').style.opacity = k(a, .4); S.$('c' + i + 'goal').style.opacity = k(a, .4)
      S.$('c' + i + 'way').style.opacity = k(a + 1, .5); S.$('c' + i + 'fix').style.opacity = k(a + 2.5, .5); S.$('c' + i + 'loss').style.opacity = k(a + 3.8, .5)
    })
    S.$('t0').style.opacity = k(28); S.$('t1').style.opacity = k(31)
    var e = t >= 35 ? '<b>Four checked cases: through, around or past what was meant to stop it.</b> The file\'s own words: the explainer.' : ''
    if (S.$('end').innerHTML !== e) S.$('end').innerHTML = e
    S.$('end').style.opacity = k(35)
  }
})()
</script>
</body>
</html>
