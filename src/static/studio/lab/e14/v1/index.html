<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E14 v1: earning autonomy</title>
<link rel="stylesheet" href="../../../../talk/engine/slide.css">
<script>window.RUV_STEPS = [{ t: 0, label: 'The licence' }, { t: 9, label: 'The levels' }, { t: 13, label: 'Climbing on evidence' }, { t: 34, label: 'A step outside' }, { t: 37, label: 'Suspension: designed' }, { t: 44, label: 'Illustrative, still' }]</script>
<script src="../../../../talk/engine/slide.js"></script>
<style>
.kk{font-size:20px;top:14px;margin:0}
.hl{top:52px;font-size:40px;right:240px}
#id{position:absolute;right:40px;top:6px;font:800 72px/1 system-ui;color:var(--head);letter-spacing:.02em}
#q{position:absolute;left:40px;top:110px;width:960px;height:28px;font:20px/28px system-ui;color:var(--text);white-space:nowrap}
#q b{color:var(--head)}
#card{position:absolute;left:40px;top:150px;width:380px;height:490px;border:2px solid var(--line2);border-radius:16px;background:var(--panel);padding:14px 20px}
#card .tt{font:800 26px/32px system-ui;color:var(--head)}
#card .tg{display:inline-block;margin:2px 0 8px;font:600 20px/24px system-ui;color:var(--dim);border:2px solid var(--line2);border-radius:999px;padding:0 10px}
#card .rw{height:62px}
#card .rw span{display:block;font:20px/24px system-ui;color:var(--dim)}
#card .rw b{display:block;font:700 22px/28px system-ui;color:var(--head);white-space:nowrap}
#card .rw b.ag{color:var(--agent)}
#pic{position:absolute;left:0;top:0;width:1280px;height:720px}
#box{position:absolute;left:470px;top:205px;width:300px;height:144px;border:2px dashed var(--risk);border-radius:14px;padding:10px 14px;background:var(--bg)}
#box b{display:block;font:800 20px/26px system-ui;color:var(--risk);letter-spacing:.03em;text-transform:uppercase}
#box p{margin:4px 0 0;font:20px/26px system-ui;color:var(--text)}
#end{position:absolute;left:40px;right:40px;top:660px;font:20px/28px system-ui;color:var(--dim);white-space:nowrap}
#end b{color:var(--head)}
</style>
</head>
<body>
<div id="cv" data-end="52">
  <p class="kk">Studio experiment E14 · v1, driven · illustrative</p>
  <div id="id">E14</div>
  <div class="hl" data-in="0">Autonomy, <em>earned level by level.</em></div>
  <div id="q"></div>
  <div id="card">
    <div class="tt" id="ct">Licence to operate</div>
    <div class="tg" id="cg">illustrative: placeholders</div>
    <div id="rows"></div>
  </div>
  <svg id="pic" viewBox="0 0 1280 720" aria-label="Illustrative. A licence card: for an agent, authorised by a named owner, held by a named holder, running under a policy, with an expiry date and accepted risks that expire. Beside it, the mandate holds four levels of autonomy as steps; the agent climbs one step each time the evidence that the level below held is in, and the gate opens and changes colour. At the end a step outside the mandate would trigger the licence's suspension, drawn dashed: designed, not shipped."></svg>
  <div id="box"><b>Designed, not shipped</b><p>If a footprint leaves the mandate, the system suspends the licence.</p></div>
  <div id="end"></div>
  <div class="bar"><i></i></div>
</div>
<script>
(function () {
  'use strict'
  // Every name, date and level here is a placeholder: the slide draws the shape of a licence to operate (RiskMandate,
  // a talk source), not any real agent, person or date. The suspension is drawn dashed because it is a design, not shipped.
  var ROWS = [['for', 'an agent', 'ag'], ['authorised by', 'a named owner'], ['held by', 'a named holder'], ['runs under', 'a policy: the mandate'], ['expires on', 'an expiry date'], ['accepted risks', 'expire; accepted again']]
  var LV = ['read only', 'suggest', 'act, checked', 'act alone']
  var X0 = 460, W = 160, TR = [590, 500, 410, 320], FL = 640, MX = [450, 150, 1110, 650]
  var GO = [13, 19, 25]          // each climb: walk 2 s, evidence at +2.5, gate opens at +3.5, climbs from +4.3 to +6
  var FX = 1070                  // where the agent stops on the top level, and where the step outside leaves
  var NS = 'http://www.w3.org/2000/svg', B = null
  function el(tag, a, p, txt) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; p.appendChild(e); return e }
  function xs(i) { return X0 + W * i }

  function build(S) {
    S.$('rows').innerHTML = ROWS.map(function (r, i) { return '<div class="rw" id="r' + i + '"><span>' + r[0] + '</span><b' + (r[2] ? ' class="' + r[2] + '"' : '') + '>' + r[1] + '</b></div>' }).join('')
    var svg = S.$('pic'), b = { lv: [], gates: [] }
    b.man = el('g', {}, svg)
    el('rect', { x: MX[0], y: MX[1], width: MX[2] - MX[0], height: MX[3] - MX[1], rx: 18, fill: 'none', stroke: 'var(--line2)', 'stroke-width': 2 }, b.man)
    el('text', { x: 472, y: 180, fill: 'var(--head)', 'font-size': 22, 'font-weight': 800, 'font-family': 'system-ui' }, b.man, 'the mandate')
    for (var i = 0; i < 4; i++) {
      var g = el('g', {}, svg), x = xs(i), y = TR[i]
      el('path', { d: 'M' + x + ' ' + FL + 'V' + y + 'H' + (x + W) + (i < 3 ? 'V' + TR[i + 1] : 'V' + FL), fill: 'none', stroke: 'var(--line2)', 'stroke-width': 3, 'stroke-linejoin': 'round' }, g)
      el('rect', { x: x + 2, y: y + 2, width: W - 4, height: FL - y - 4, fill: 'var(--panel)' }, g)
      var t1 = el('text', { x: x + 8, y: y - 80, fill: 'var(--dim)', 'font-size': 20, 'font-family': 'system-ui' }, g, 'level ' + (i + 1))
      var t2 = el('text', { x: x + 8, y: y - 54, fill: 'var(--dim)', 'font-size': 21, 'font-weight': 800, 'font-family': 'system-ui' }, g, LV[i])
      var ev = el('text', { x: x + 10, y: y + 32, fill: i ? 'var(--accent)' : 'var(--dim)', 'font-size': 20, 'font-family': 'system-ui' }, g)
      if (i) { el('tspan', { x: x + 10 }, ev, 'unlocked on'); el('tspan', { x: x + 10, dy: 24 }, ev, 'level ' + i + ' held') } else ev.textContent = 'on day one'
      b.lv.push({ g: g, name: t2, ev: ev })
    }
    for (i = 0; i < 3; i++) {           // the gate on level i+1's tread, just before its riser
      var gx = xs(i + 1) - 36, gy = TR[i], w = el('g', {}, svg)
      var top = el('rect', { x: gx - 6, y: gy - 44, width: 12, height: 22, rx: 3, fill: 'var(--dim)' }, w)
      var bot = el('rect', { x: gx - 6, y: gy - 22, width: 12, height: 22, rx: 3, fill: 'var(--dim)' }, w)
      if (i === 1) el('text', { x: gx, y: gy - 54, 'text-anchor': 'middle', fill: 'var(--dim)', 'font-size': 20, 'font-family': 'system-ui' }, w, 'gate')
      b.gates.push({ g: w, top: top, bot: bot, x: gx, y: gy })
    }
    // the agent's path: along each tread, up each riser, to the top level
    var d = 'M' + (X0 + 18) + ' ' + (TR[0] - 12)
    for (i = 0; i < 3; i++) d += 'H' + (xs(i + 1) - 14) + 'V' + (TR[i + 1] - 12)
    d += 'H' + FX
    b.path = el('path', { d: d, fill: 'none', stroke: 'var(--agent)', 'stroke-width': 4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg)
    b.len = b.path.getTotalLength(); b.path.setAttribute('stroke-dasharray', b.len + ' ' + b.len)
    // lengths along the path where each walk and climb ends
    var L = [], run = 0
    for (i = 0; i < 3; i++) { run += xs(i + 1) - 14 - (i ? xs(i) - 14 : X0 + 18); L.push(run); run += TR[i] - TR[i + 1]; L.push(run) }
    run += FX - (xs(3) - 14); L.push(run); b.L = L
    b.dot = el('circle', { r: 10, fill: 'var(--agent)' }, svg)
    b.ag = el('text', { 'text-anchor': 'end', 'font-size': 20, 'font-weight': 700, fill: 'var(--agent)', 'font-family': 'system-ui' }, svg, 'the agent')
    // the step outside (the agent's, so red, dashed: it has not happened) and the designed suspension (dashed)
    b.out = el('path', { d: 'M' + FX + ' ' + (TR[3] - 24) + 'V' + 140, fill: 'none', stroke: 'var(--agent)', 'stroke-width': 3, 'stroke-dasharray': '6 7' }, svg)
    // where the step outside crosses it, the mandate's wall breaks: dashed, in the designed colour
    b.brk = el('g', {}, svg)
    el('path', { d: 'M1036 150H1092', stroke: 'var(--bg)', 'stroke-width': 6 }, b.brk)
    el('path', { d: 'M1036 150H1092', stroke: 'var(--risk)', 'stroke-width': 3, 'stroke-dasharray': '6 6' }, b.brk)
    b.ring = el('g', {}, svg)
    el('circle', { cx: FX, cy: 128, r: 11, fill: 'none', stroke: 'var(--agent)', 'stroke-width': 3, 'stroke-dasharray': '5 4' }, b.ring)
    el('text', { x: FX + 20, y: 135, fill: 'var(--agent)', 'font-size': 20, 'font-family': 'system-ui' }, b.ring, 'a step outside')
    b.sus = el('path', { d: 'M' + (FX - 14) + ' 136L772 206', fill: 'none', stroke: 'var(--risk)', 'stroke-width': 3, 'stroke-dasharray': '8 7' }, svg)
    b.arr = el('g', {}, svg)
    el('path', { d: 'M468 300H428', fill: 'none', stroke: 'var(--risk)', 'stroke-width': 3, 'stroke-dasharray': '8 6' }, b.arr)
    el('path', { d: 'M436 292L424 300L436 308', fill: 'none', stroke: 'var(--risk)', 'stroke-width': 3 }, b.arr)
    B = b
  }

  function at(s) {                       // the agent's distance along its path at time s
    var L = B.L, w = function (a, b, x0, x1) { return x0 + (x1 - x0) * SLIDE.ease(SLIDE.seg(s, a, b)) }
    var p = w(11.5, 15, 0, L[0])
    for (var i = 0; i < 3; i++) {
      var g = GO[i]
      if (s >= g + 4.3) p = w(g + 4.3, g + 6, L[2 * i], L[2 * i + 1])
      if (s >= g + 6) p = w(g + 6, i < 2 ? GO[i + 1] + 2 : g + 7.5, L[2 * i + 1], i < 2 ? L[2 * i + 2] : L[6])
    }
    return p
  }

  var Q = [[0, '<b>A licence to operate:</b> who authorised it, who holds it, the policy it runs under, when it expires.'],
    [9, '<b>Inside the mandate, levels of autonomy.</b> The agent starts on the first.'],
    [13, '<b>Each level is unlocked by evidence</b> that the one below held.'],
    [34, '<b>If the footprint leaves the mandate,</b> the licence should be suspended ...'],
    [37, '<b>... by the system, not a quarterly review.</b> That part is designed, not shipped.'],
    [44, '<b>Illustrative:</b> no real agent, person or date. Names and levels are placeholders.']]

  window.SLIDE_RENDER = function (t, S) {
    if (!B) build(S)
    var k = function (a, d) { return S.ease(S.seg(t, a, a + (d || .6))) }
    var q = ''; Q.forEach(function (x) { if (t >= x[0]) q = x[1] })
    if (S.$('q').innerHTML !== q) S.$('q').innerHTML = q
    S.$('q').style.opacity = k(.3)
    S.$('card').style.opacity = k(1); S.$('cg').style.opacity = k(1.6)
    ROWS.forEach(function (r, i) { S.$('r' + i).style.opacity = k(2 + i, .5) })
    B.man.style.opacity = k(9)
    B.lv.forEach(function (l, i) {
      l.g.style.opacity = k(9.3 + i * .4, .5)
      var open = i ? GO[i - 1] + 3.5 : 11
      l.name.setAttribute('fill', t >= open ? 'var(--head)' : 'var(--dim)')
      l.ev.style.opacity = i ? k(GO[i - 1] + 2.5, .5) : k(10)
    })
    B.gates.forEach(function (g, i) {
      var o = S.ease(S.seg(t, GO[i] + 3.5, GO[i] + 4.2)), c = t >= GO[i] + 3.5 ? 'var(--accent)' : 'var(--dim)'
      g.g.style.opacity = k(10.5)
      g.top.setAttribute('fill', c); g.bot.setAttribute('fill', c)
      g.top.setAttribute('transform', 'rotate(' + (-70 * o) + ' ' + (g.x + 7) + ' ' + (g.y - 44) + ')')
      g.bot.setAttribute('transform', 'rotate(' + (70 * o) + ' ' + (g.x + 7) + ' ' + g.y + ')')
    })
    var p = at(t), pt = B.path.getPointAtLength(Math.max(.01, p))
    B.path.setAttribute('stroke-dashoffset', B.len - p)
    B.path.style.opacity = k(11)
    B.dot.setAttribute('cx', pt.x); B.dot.setAttribute('cy', pt.y); B.dot.style.opacity = k(11, .4)
    // "the agent" beside the dot once it has stopped on the top level; the card's red "an agent" names it before
    B.ag.setAttribute('x', pt.x - 18); B.ag.setAttribute('y', pt.y - 14)
    B.ag.style.opacity = k(32.6, .5)
    var o = S.ease(S.seg(t, 34, 35.6))
    B.out.setAttribute('d', 'M' + FX + ' ' + (TR[3] - 24) + 'V' + S.lerp(TR[3] - 24, 140, o)); B.out.style.opacity = o > 0 ? 1 : 0
    B.brk.style.opacity = k(35.2, .4); B.ring.style.opacity = k(35.4)
    var s2 = S.ease(S.seg(t, 37, 38.4))
    B.sus.setAttribute('d', 'M' + (FX - 14) + ' 136L' + S.lerp(FX - 14, 772, s2) + ' ' + S.lerp(136, 206, s2)); B.sus.style.opacity = s2 > 0 ? 1 : 0
    S.$('box').style.opacity = k(38.2)
    B.arr.style.opacity = k(39.4)
    var e = t >= 44 ? '<b>Today a licence is a record of a decision, with a name and an expiry.</b> The suspension is what is being built.' : ''
    if (S.$('end').innerHTML !== e) S.$('end').innerHTML = e
    S.$('end').style.opacity = k(44)
  }
})()
</script>
</body>
</html>
