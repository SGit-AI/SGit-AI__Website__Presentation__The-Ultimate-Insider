<body>
<div id="cv" data-end="56">

</div>
<script>
(function () {

    var A = '<div class="g" data-t="13">The mandate, granted (' + D.aligned + ')</div>' + core.map(function (r) { return item(r.capability, 'core', num[r.capability]) }).join('')
      + item(sf, 'sf', '×').replace(/<span>[^<]*<\/span>/, '<span>asked for, not granted</span>')

    groups.forEach(function (g, gi) {
      var h = '<div class="g" data-t="' + (19.1 + .25 * ((g.rows.length ? num[g.rows[0].capability] : 5) - 5)) + '">' + g.name + ' (' + g.rows.length + ')</div>' + g.rows.map(function (r) { return item(r.capability, 'ex', num[r.capability]) }).join('')
      if (gi === 0) A += h; else Bh += h
    })
    S.$('colA').innerHTML = A; S.$('colB').innerHTML = Bh

    B = { dots: dots, heads: heads, items: [].slice.call(document.querySelectorAll('.it')), num: num }
  }

  window.SLIDE_RENDER = function (t, S) {

    var k = function (a, d) { return S.ease(S.seg(t, a, a + (d || .8))) }

    ;['ring-unstated', 'ring-refused', 'lab-un', 'lab-ref'].forEach(function (id) { S.$(id).style.opacity = k(19) })
    S.$('sectors').style.opacity = k(19.5); S.$('core').style.opacity = k(13); S.$('lab-core').style.opacity = k(13); S.$('sf').style.opacity = k(28)
    B.dots.forEach(function (d, i) {

      var gk = k(35), mixed = d.r.barrier_kind !== 'none'

    })

  }
