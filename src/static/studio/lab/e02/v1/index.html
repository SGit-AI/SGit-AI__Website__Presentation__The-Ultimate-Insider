<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E02 v1: the blast radius, from the grant rows</title>
<link rel="stylesheet" href="../../../../talk/engine/slide.css">
<script>window.RUV_STEPS = [{ t: 0, label: 'its reach' }, { t: 5, label: 'one dot per row' }, { t: 13, label: 'the mandate' }, { t: 19, label: 'the excess' }, { t: 27, label: 'the shortfall' }, { t: 34, label: 'the barriers' }]</script>
<script src="../../../../talk/engine/slide.js"></script>
<style>
.kk{font-size:20px;top:14px}
.hl{top:56px;font-size:40px}
#disc{position:absolute;left:60px;top:262px;width:470px;height:436px}
#rows{position:absolute;left:620px;top:118px;width:610px;font:20px/1 ui-monospace,SFMono-Regular,Menlo,monospace}
#rows .g{font:800 20px system-ui;letter-spacing:.06em;text-transform:uppercase;margin:10px 0 6px;color:var(--dim)}
#rows .r{display:flex;align-items:center;gap:10px;height:25px;color:var(--dim)}
#rows .r i{flex:none;width:20px;text-align:center;font-style:normal}
#rows .r.core{color:var(--head)}
#rows .r.ex{color:var(--agent)}
#rows .r.sf{color:var(--dim);text-decoration:line-through}
#rows .b{margin-left:auto;font:600 20px system-ui;color:var(--dim)}
#sum{position:absolute;left:60px;top:128px;width:530px;font:700 22px/1.3 system-ui;color:var(--head)}
#note{position:absolute;left:560px;right:50px;bottom:12px;font:20px/1.25 system-ui;color:var(--dim)}
</style>
</head>
<body>
<div id="cv" data-end="54">
  <p class="kk a">Studio experiment E02 · v1, driven</p>
  <div class="hl" data-in="0">The blast radius is <em>everything its grant reaches.</em></div>
  <svg id="disc" viewBox="0 0 560 520" aria-label="The grant rows of one example agent, placed by distance from what it is for"></svg>
  <div id="rows"></div>
  <div id="sum"></div>
  <div id="note" data-in="1">A published draft: abp.sgit.ai's example of the Claude Code CLI, confirmations on; derived, 0 of 22 rows measured. No score or rating is given.</div>
  <div class="bar"><i></i></div>
</div>
<script>
(function () {
  'use strict'
  var D = null, NS = 'http://www.w3.org/2000/svg', CX = 280, CY = 250, built = false
  var GLYPH = { none: '●', expectation: '◎', setting: '◐', boundary: '○' }
  fetch('../../../data/abp-examples.json').then(function (r) { return r.json() }).then(function (j) {
    D = j.examples.filter(function (e) { return e.id === 'claude-code-cli-confirmations-enabled' })[0]
  }).catch(function (e) { console.error('E02: the data file did not load', e) })

  function build(S) {                                                // once the data is in: one dot and one row per grant row
    var svg = S.$('disc'), rows = S.$('rows'), core = [], un = [], ref = []
    D.rows.forEach(function (r) { (r.mandate_stance === 'authorised' ? core : r.mandate_stance === 'unstated' ? un : ref).push(r) })
    var ring = function (list, rad, a0) { return list.map(function (r, i) { var a = a0 + 2 * Math.PI * i / list.length; return { r: r, x: CX + rad * Math.cos(a), y: CY + rad * Math.sin(a) } }) }
    var pts = ring(core, 62, -Math.PI / 2).concat(ring(un, 140, -Math.PI / 4), ring(ref, 212, -Math.PI / 2))
    var halo = document.createElementNS(NS, 'circle'); halo.id = 'reach'; halo.setAttribute('cx', CX); halo.setAttribute('cy', CY); halo.setAttribute('r', 240)
    halo.setAttribute('fill', 'var(--agent-t)'); halo.setAttribute('stroke', 'var(--agent)'); halo.setAttribute('stroke-dasharray', '5 8'); svg.appendChild(halo)
    var coreRing = document.createElementNS(NS, 'circle'); coreRing.id = 'core'; coreRing.setAttribute('cx', CX); coreRing.setAttribute('cy', CY); coreRing.setAttribute('r', 92)
    coreRing.setAttribute('fill', 'none'); coreRing.setAttribute('stroke', 'var(--head)'); coreRing.setAttribute('stroke-width', 4); svg.appendChild(coreRing)
    var box = document.createElementNS(NS, 'text'); box.textContent = 'model'; box.setAttribute('x', CX); box.setAttribute('y', CY + 7); box.setAttribute('text-anchor', 'middle')
    box.setAttribute('font-size', 24); box.setAttribute('font-weight', 700); box.setAttribute('fill', 'var(--head)'); svg.appendChild(box)
    pts.forEach(function (p, i) {
      var c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', 11); c.id = 'd' + i
      c.setAttribute('fill', p.r.mandate_stance === 'authorised' ? 'var(--head)' : 'var(--agent)'); svg.appendChild(c); p.el = c
    })
    var sf = D.shortfall_capabilities[0], sfDot = document.createElementNS(NS, 'circle'); sfDot.id = 'sf'
    sfDot.setAttribute('cx', CX + 65); sfDot.setAttribute('cy', CY + 65); sfDot.setAttribute('r', 15); sfDot.setAttribute('fill', 'none')
    sfDot.setAttribute('stroke', 'var(--head)'); sfDot.setAttribute('stroke-width', 3); sfDot.setAttribute('stroke-dasharray', '4 4'); svg.appendChild(sfDot)
    var sfT = document.createElementNS(NS, 'text'); sfT.id = 'sft'; sfT.textContent = 'asked, not granted'; sfT.setAttribute('x', CX + 40); sfT.setAttribute('y', CY + 122)
    sfT.setAttribute('text-anchor', 'start'); sfT.setAttribute('font-size', 24); sfT.setAttribute('font-weight', 700); sfT.setAttribute('fill', 'var(--head)'); sfT.setAttribute('paint-order', 'stroke'); sfT.setAttribute('stroke', 'var(--bg)'); sfT.setAttribute('stroke-width', 6); svg.appendChild(sfT)
    var html = '', row = function (r, cls) { return '<div class="r ' + cls + '"><i class="gl" data-k="' + r.barrier_kind + '"></i><span>' + r.capability + '</span><span class="b" data-k="' + r.barrier_kind + '"></span></div>' }
    html += '<div class="g" id="g1">The mandate, granted (' + D.aligned + ')</div>' + core.map(function (r) { return row(r, 'core') }).join('')
    html += '<div class="r sf" id="sfrow"><i></i><span>' + sf + '</span><span class="b">asked, not granted</span></div>'
    html += '<div class="g" id="g2">The excess (' + D.excess + '): unstated ' + un.length + ', refused ' + ref.length + '</div>' + un.concat(ref).map(function (r) { return row(r, 'ex') }).join('')
    rows.innerHTML = html
    built = { pts: pts, rows: [].slice.call(rows.querySelectorAll('.r')), heads: [S.$('g1'), S.$('g2')] }
  }

  window.SLIDE_RENDER = function (t, S) {
    if (!D) return
    if (!built) build(S)
    var k = function (a, d) { return S.ease(S.seg(t, a, a + (d || .8))) }
    // 0 to 5: the reach as E01 left it, one shaded disc; 5 to 12: it breaks into one dot per grant row
    var reach = S.$('reach'); reach.style.opacity = 1 - .65 * k(6, 3)
    built.pts.forEach(function (p, i) { var a = 5 + i * .35; p.el.style.opacity = k(a); p.el.setAttribute('r', 11 * (.4 + .6 * k(a))) })
    S.$('core').style.opacity = k(13)
    S.$('sf').style.opacity = k(27); S.$('sft').style.opacity = k(27)
    // the rows, in step: the mandate core at 13, the shortfall at 27, the excess at 19
    built.rows.forEach(function (r) { var a = r.classList.contains('core') ? 13.5 : r.classList.contains('sf') ? 27.5 : 19 + .3 * built.rows.indexOf(r) / 3; r.style.opacity = k(a) })
    built.heads[0].style.opacity = k(13); built.heads[1].style.opacity = k(19)
    // the barrier kinds, from 34
    built.rows.forEach(function (r) {
      var g = r.querySelector('.gl'), b = r.querySelector('.b'); if (!g || !g.dataset.k) return
      var on = t >= 34; g.textContent = on ? GLYPH[g.dataset.k] : ''; if (b.dataset.k) b.textContent = on ? g.dataset.k : ''
    })
    // the summary, step by step, numbers only from the file
    var s = ''
    if (t >= 1) s = 'Its reach, as E01 ended.'
    if (t >= 6) s = 'Grant: ' + D.grant + ' things it can do.'
    if (t >= 13) s = 'Grant: ' + D.grant + '. What it is for, the mandate: ' + D.mandate + ', of which ' + D.aligned + ' are granted.'
    if (t >= 19) s = 'Grant ' + D.grant + ', mandate granted ' + D.aligned + ': the excess is ' + D.grant + ' minus ' + D.aligned + ' = ' + D.excess + '. That is the blast radius.'
    if (t >= 27) s = 'Excess ' + D.excess + '. And one thing it was asked to do and cannot: ' + D.shortfall_capabilities[0] + '.'
    if (t >= 34) s = 'Grant ' + D.grant + ' minus mandate granted ' + D.aligned + ' = excess ' + D.excess + ', the blast radius. In the way of it: ' + D.unbounded_excess + ' of ' + D.excess + ' have no control, only nothing, a rule in prose, or a switch its own account can flip.'
    if (S.$('sum').textContent !== s) S.$('sum').textContent = s
  }
})()
</script>
</body>
</html>
