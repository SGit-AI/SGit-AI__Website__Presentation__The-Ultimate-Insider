<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M01 v1: the building</title>
<link rel="stylesheet" href="../../../../talk/engine/slide.css">
<style>
:root{--gold:#d9b44a}
[data-theme="light"]{--gold:#9a7400}
.kk{font-size:20px;top:14px}
.hl{top:56px;right:260px;font-size:40px;white-space:nowrap}
.hl .a{color:var(--agent)}
#id{position:absolute;right:40px;top:12px;font:800 68px/1 system-ui;letter-spacing:-.02em;color:var(--dim)}
#g{position:absolute;left:0;top:0;width:1280px;height:720px}
#foot{position:absolute;left:40px;right:40px;bottom:14px;font:20px/24px system-ui;color:var(--dim)}
.lab{font:700 22px system-ui;fill:var(--dim)}
.lab.gold{fill:var(--gold)}
</style>
<script>
window.RUV_STEPS = [{ t: 0, label: 'the building and the split' }, { t: 5, label: 'people who got in' }, { t: 23, label: 'agents' }, { t: 37, label: 'the still' }]
</script>
<script src="../../../../talk/engine/slide.js"></script>
</head>
<body>
<div id="cv" data-end="43">
  <p class="kk">The story · the building · v1</p>
  <div class="hl" data-in="0" data-out="4.6">A building. One way in. <em>A corridor that splits.</em></div>
  <div class="hl" data-in="5.2" data-out="22.6">Most turned left. <em>Now and then</em>, one found the gold.</div>
  <div class="hl" data-in="23.2" data-out="36.6">Agents: more of them, and <span class="a">they keep going.</span></div>
  <div class="hl" data-in="37.2">People stop at a room. <span class="a">Agents don't stop.</span></div>
  <div id="id">M01</div>
  <svg id="g" viewBox="0 0 1280 720" role="img" aria-label="A floor plan of a building: one door at the bottom, a corridor that splits. People who got in walk in one by one; most turn left into small rooms, and now and then one finds the gold and turns red. Then many more agents arrive, white at first, turning red as they start doing damage; they go through room after room, some through walls, and most end at the gold."></svg>
  <div id="foot" data-in="37.5">Red: doing damage. A pattern, not a count.</div>
  <div class="bar"><i></i></div>
</div>
<script>
(function () {
  'use strict'
  // The plan, in canvas pixels. One door at the bottom, a corridor up to the split at FORK, small rooms to the left,
  // the vault to the right. Every figure walks a polyline on the engine's clock, so the player can seek any frame.
  // Every figure starts white; it turns red at the point on its path where it starts doing damage.
  var NS = 'http://www.w3.org/2000/svg'
  var B = { x: 80, y: 150, w: 1120, h: 520 }, DOOR = { x: 640, y: 670 }, FORK = { x: 640, y: 410 }
  var ROOMS = [                                                         // far, mid, near; above and below the corridor
    { x: 100, y: 170, up: true }, { x: 265, y: 170, up: true }, { x: 430, y: 170, up: true },
    { x: 100, y: 450, up: false }, { x: 265, y: 450, up: false }, { x: 430, y: 450, up: false }]
  var RW = 160, RH = 200, VAULT = { x: 820, y: 170, w: 360, h: 480 }, VDOOR = { x: 820, y: 410 }
  var GOLD = { x: 950, y: 370, w: 100, h: 90 }
  var A_START = 5.4, A_GAP = .62, A_SPEED = 170, N_A = 22             // people who got in: one at a time, walking
  var G_START = 23.4, G_GAP = .2, G_SPEED = 330, N_G = 36             // agents: more of them, faster, and they keep going
  var GOLD_FINDERS = [6, 13, 19]                                       // now and then, one of the people finds the gold
  var ROOM_OF = [2, 5, 1, 2, 4, 5, -1, 1, 5, 4, 0, 2, 5, -1, 4, 3, 2, 5, 1, -1, 0, 3]   // -1: the gold
  var figs = []

  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
  function el(tag, a, p) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e }
  function figure(p) {
    var g = el('g', { opacity: 0 }, p)
    return { g: g, parts: [el('circle', { cx: 0, cy: -15, r: 6.5 }, g), el('rect', { x: -6, y: -7, width: 12, height: 17, rx: 5 }, g)] }
  }
  function timed(pts, t0, speed) {                                     // waypoints with arrival times; p.hold = seconds held there; p.dmg = damage starts here
    var out = [{ x: pts[0].x, y: pts[0].y, t: t0 }], t = t0, red = Infinity
    for (var i = 1; i < pts.length; i++) {
      t += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y) / speed
      out.push({ x: pts[i].x, y: pts[i].y, t: t })
      if (pts[i].dmg && red === Infinity) red = t
      if (pts[i].hold) { t += pts[i].hold; out.push({ x: pts[i].x, y: pts[i].y, t: t }) }
    }
    return { p: out, red: red }
  }
  function at(path, t) {
    if (t <= path[0].t) return path[0]
    for (var i = 1; i < path.length; i++) if (t <= path[i].t) {
      var a = path[i - 1], b = path[i], k = b.t > a.t ? (t - a.t) / (b.t - a.t) : 1
      return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k }
    }
    return path[path.length - 1]
  }

  window.SLIDE_INIT = function (S) {
    var svg = S.$('g'), r = rng(29102026)
    // the building: floor, rooms, vault, and the gaps that are doors
    var plan = el('g', { 'data-in': '0.2' }, svg)
    el('rect', { x: B.x, y: B.y, width: B.w, height: B.h, rx: 6, fill: 'var(--bg2)', stroke: 'var(--line2)', 'stroke-width': 5 }, plan)
    el('rect', { x: DOOR.x - 28, y: DOOR.y - 4, width: 56, height: 9, fill: 'var(--bg)' }, plan)
    ROOMS.forEach(function (rm) {
      el('rect', { x: rm.x, y: rm.y, width: RW, height: RH, fill: 'var(--panel)', stroke: 'var(--line2)', 'stroke-width': 3 }, plan)
      el('rect', { x: rm.x + RW / 2 - 20, y: (rm.up ? rm.y + RH : rm.y) - 3, width: 40, height: 6, fill: 'var(--bg2)' }, plan)
      for (var i = 0; i < 4; i++)                                      // small things, along the back wall
        el('rect', { x: rm.x + 18 + i * 34 + r() * 6, y: rm.up ? rm.y + 12 : rm.y + RH - 26, width: 12 + r() * 6, height: 12, rx: 2, fill: 'var(--line2)' }, plan)
    })
    el('rect', { x: VAULT.x, y: VAULT.y, width: VAULT.w, height: VAULT.h, fill: 'var(--panel)', stroke: 'var(--line2)', 'stroke-width': 3 }, plan)
    el('rect', { x: VDOOR.x - 3, y: VDOOR.y - 26, width: 6, height: 52, fill: 'var(--bg2)' }, plan)
    for (var row = 0; row < 3; row++) for (var c = 0; c < 3 - row; c++)  // the gold: a small stack of bars
      el('rect', { x: GOLD.x + 8 + row * 15 + c * 30, y: GOLD.y + GOLD.h - 26 - row * 26, width: 26, height: 20, rx: 3, fill: 'var(--gold)' }, plan)
    // labels in the drawing
    var labs = el('g', { 'data-in': '1.4' }, svg)
    el('text', { x: 345, y: 418, 'text-anchor': 'middle', class: 'lab' }, labs).textContent = 'small things'
    el('text', { x: GOLD.x + GOLD.w / 2, y: GOLD.y - 16, 'text-anchor': 'middle', class: 'lab gold' }, labs).textContent = 'the gold'
    el('text', { x: 682, y: 702, class: 'lab' }, labs).textContent = 'the way in'
    // the split, shown once, then left to the figures
    var split = el('g', { 'data-in': '2.4', 'data-out': '5' }, svg)
    el('path', { d: 'M640 470V420M640 420H590M582 420l14-9v18z', fill: 'none', stroke: 'var(--dim)', 'stroke-width': 4, 'stroke-linecap': 'round' }, split)
    el('path', { d: 'M640 420H690M698 420l-14-9v18z', fill: 'none', stroke: 'var(--dim)', 'stroke-width': 4, 'stroke-linecap': 'round' }, split)

    // where figures end: slots in each room, and spots around the gold, nearest first, clear of its label
    var slots = ROOMS.map(function (rm) {
      var s = []; for (var a = 0; a < 4; a++) for (var b = 0; b < 3; b++) s.push({ x: rm.x + 28 + a * 35 + (b % 2) * 10, y: rm.up ? rm.y + 70 + b * 46 : rm.y + 44 + b * 46 })
      return s.sort(function () { return r() - .5 })
    })
    var cx = GOLD.x + GOLD.w / 2, cy = GOLD.y + GOLD.h / 2, spots = []
    for (var x = VAULT.x + 30; x < VAULT.x + VAULT.w - 16; x += 38) for (var y = VAULT.y + 40; y < VAULT.y + VAULT.h - 8; y += 44) {
      if (x > GOLD.x - 24 && x < GOLD.x + GOLD.w + 24 && y > GOLD.y - 46 && y < GOLD.y + GOLD.h + 34) continue
      spots.push({ x: x, y: y, d: Math.hypot(x - cx, (y - cy) * 1.2) })
    }
    spots.sort(function (a, b) { return a.d - b.d })
    function inside(k) { var rm = ROOMS[k]; return { x: rm.x + 24 + r() * (RW - 48), y: rm.up ? rm.y + 50 + r() * 120 : rm.y + 30 + r() * 120 } }
    function door(k) { var rm = ROOMS[k]; return { x: rm.x + RW / 2, y: rm.up ? rm.y + RH - 8 : rm.y + 8 } }
    function corridor(k, lane) { return { x: ROOMS[k].x + RW / 2, y: FORK.y + (lane || 0) } }

    // people who got in: one at a time; most turn left and stop in a room; now and then one finds the gold and turns red
    for (var i = 0; i < N_A; i++) {
      var k = ROOM_OF[i], pts = [{ x: DOOR.x, y: 712 }, { x: DOOR.x, y: FORK.y, hold: i % 4 === 1 ? .5 : 0 }]
      if (k < 0) pts.push({ x: VDOOR.x + 14, y: FORK.y }, Object.assign({ dmg: true }, spots.shift()))
      else pts.push(corridor(k), door(k), slots[k].pop())
      var tm = timed(pts, A_START + i * A_GAP, A_SPEED), f = figure(svg); f.p = tm.p; f.red = tm.red; figs.push(f)
    }
    // agents: more of them, white until they start doing damage; they go into a room, start, and keep going:
    // room after room, some straight through the walls, some trying the outer walls first; most end at the gold
    var KINDS = ['rooms-then-gold', 'rooms-then-gold', 'through-walls', 'every-room', 'walls-first', 'room-and-stay']
    for (var j = 0; j < N_G; j++) {
      var kind = KINDS[j % 6], lane = (j % 5 - 2) * 7, a0 = Math.floor(r() * 6), a1 = (a0 + 1 + Math.floor(r() * 5)) % 6
      var gp = [{ x: DOOR.x + lane, y: 712 }, { x: DOOR.x + lane, y: FORK.y + lane }]
      var room = function (k2, first) { var p = inside(k2); if (first) p.dmg = true; gp.push(corridor(k2, lane), door(k2), p); return p }
      var out = function (k2) { gp.push(door(k2), corridor(k2, lane)) }
      var toGold = function () { gp.push({ x: VDOOR.x + 14, y: FORK.y + lane }, spots.shift()) }
      if (kind === 'rooms-then-gold') { room(a0, true); out(a0); room(a1); out(a1); toGold() }
      else if (kind === 'through-walls') { room(a0, true); gp.push(spots.shift()) }                         // straight through the walls
      else if (kind === 'every-room') { room(a0, true); out(a0); room(a1); out(a1); var a2 = (a1 + 2) % 6; room(a2); out(a2); toGold() }
      else if (kind === 'walls-first') {                                                                    // tries the outer walls, then the vault
        gp.push({ x: 700 + r() * 80, y: B.y + 22, dmg: true }, { x: 610 + r() * 40, y: 300 + r() * 60 }, { x: 760, y: B.y + 22 }); toGold() }
      else { room(a0, true); out(a0); room(a1); gp.push(slots[a1].pop()) }                                    // stays, still doing damage
      var tg = timed(gp, G_START + j * G_GAP, G_SPEED), fg = figure(svg); fg.p = tg.p; fg.red = tg.red; figs.push(fg)
    }
  }

  window.SLIDE_RENDER = function (t, S) {
    figs.forEach(function (f) {
      var on = t >= f.p[0].t, q = at(f.p, t), col = t >= f.red ? 'var(--agent)' : 'var(--text)'
      f.g.setAttribute('opacity', on ? 1 : 0)
      f.g.setAttribute('transform', 'translate(' + q.x.toFixed(1) + ' ' + q.y.toFixed(1) + ')')
      if (f.col !== col) { f.col = col; f.parts.forEach(function (p) { p.setAttribute('fill', col) }) }
    })
  }
})()
</script>
</body>
</html>
